name: Auto Build & Export for iOS

on:
  push:
    branches: [ main, master ]
  schedule:
    # 每週一 00:00 自動執行一次
    - cron: '0 0 * * 1'
  workflow_dispatch: # 支援手動觸發

jobs:
  build-and-export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Conversion Script
        run: |
          python - << 'EOF'
          import plistlib
          import glob
          import os

          plist_data = []
          # 搜尋資料夾內所有 dict.yaml 檔案
          dict_files = glob.glob('**/*.dict.yaml', recursive=True)

          for file_path in dict_files:
              with open(file_path, 'r', encoding='utf-8') as f:
                  for line in f:
                      line = line.strip()
                      if not line or line.startswith('#') or line.startswith('---') or ':' in line:
                          continue
                      parts = line.split('\t')
                      if len(parts) >= 2:
                          word = parts[0]
                          code = parts[1]
                          plist_data.append({'shortcut': code, 'phrase': word})

          # 輸出為 iOS 文字替換格式
          with open('TextReplacements.plist', 'wb') as f:
              plistlib.dump(plist_data, f)

          print(f"Successfully processed {len(plist_data)} entries into TextReplacements.plist")
          EOF

      - name: Package Rime Schema (For Hamster / Rime App)
        run: |
          # 打包所有 yaml 檔為 zip，方便直接匯入 iOS 倉輸入法
          zip -r cangjie5_advanced_ios.zip *.yaml

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: "Latest Auto-Built Rime Schema"
          body: "這是在此時間自動構建的最新 iOS 適用檔 (包含 .plist 與 .zip 包)。"
          files: |
            TextReplacements.plist
            cangjie5_advanced_ios.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
